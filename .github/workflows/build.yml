name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
    contents: write

jobs:
    Build:
        name: Build Nightcord Multi-Platform
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build Desktop (Windows, Linux, macOS bundle)
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir -p release

                  cp browser/browser.* release/ || true
                  cp Nightcord.user.{js,js.LEGAL.txt} release/ || true

                  # Copy plugin metadata, extension zips, desktop asars
                  cp *.{json,zip,asar} release/ || true

                  # Copy desktop bundles and installer script
                  cp desktop/* release/ || true
                  cp ../install.sh release/install.sh

                  find release -size 0 -delete
                  rm -f release/package.json
                  rm -f release/*.map

            - name: Upload Nightcord Multi-OS Release
              run: |
                  gh release upload latest --clobber dist/release/* || gh release create latest --title "Nightcord Latest" --notes "Automated Multi-OS release for Windows, Linux (including NixOS) and macOS" dist/release/*
